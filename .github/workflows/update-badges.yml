name: Update badges

on: 
  workflow_dispatch:
  schedule:
    # Runs at 0am UTC every day
    - cron: "0 0 * * *"
jobs:
  update-readme:
    name: Update Readme with badges
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Badges - Readme
        uses: pemtajo/badge-readme@3.2
        with:
          CREDLY_USER: ${{ secrets.CREDLY_USER }}
          NUMBER_LAST_BADGES: 0
